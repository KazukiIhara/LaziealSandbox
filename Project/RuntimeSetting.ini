[Runtime]
assetRoot = ../Dependencies/LaziealRuntime/Dependencies/LaziealGraphicsFramework/Project/Assets

[Graphics]
vsync = true
frameContextCount = 2

[Window]
title = Lazieal Sandbox | Title: G Gamepad, P Point Light, Enter Collision | Camera: Arrows+Q/E
width = 1280
height = 720
fullscreen = false

[Input.Gamepad]
enabled = true
combineJoyCons = false
verticalJoyCons = true
backgroundInput = false

[Input.Gamepad.JoyCon.Left]
gyroscopeEnabled = true
accelerometerEnabled = true

[Input.Gamepad.JoyCon.Right]
gyroscopeEnabled = true
accelerometerEnabled = true
